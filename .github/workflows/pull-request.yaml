name: "Pull Request"

on:
  pull_request:

jobs:
  detect-changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      charts: ${{ steps.filter.outputs.charts }}
      chart_names: ${{ steps.get-chart-names.outputs.list }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      
      - name: Filter changes
        uses: dorny/paths-filter@v4
        id: filter
        with:
          list-files: json
          filters: |
            charts:
              - 'charts/*/**'

      - name: Get chart names
        id: get-chart-names
        if: steps.filter.outputs.charts == 'true'
        run: |
          files='${{ steps.filter.outputs.charts_files }}'
          # Extract chart names from file paths (charts/chart-name/...)
          charts=$(echo $files | jq -r '.[]' | cut -d/ -f2 | sort -u | jq -R . | jq -s -c .)
          echo "list=$charts" >> $GITHUB_OUTPUT

  lint:
    name: Lint
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.charts == 'true' }}
    uses: ./.github/workflows/charts-lint.yaml
    with:
      checkoutCommit: ${{ github.event.pull_request.head.sha }}
      chartsToLint: ${{ needs.detect-changes.outputs.chart_names }}
      isRenovatePR: ${{ startsWith(github.head_ref, 'renovate/') && 'true' || 'false' }}

  test:
    name: Test
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.charts == 'true' }}
    uses: ./.github/workflows/charts-tests.yaml
    with:
      checkoutCommit: ${{ github.event.pull_request.head.sha }}
      chartsToTest: ${{ needs.detect-changes.outputs.chart_names }}

  version-check:
    name: Chart version bumped
    needs: detect-changes
    # Renovate PRs get their bump from the generate job below
    if: ${{ needs.detect-changes.outputs.charts == 'true' && !startsWith(github.head_ref, 'renovate/') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Check that changed charts bump their version
        run: |
          CHARTS=$(echo '${{ needs.detect-changes.outputs.chart_names }}' | jq -r '.[]')
          ./.github/scripts/check-chart-versions.sh --base "origin/${{ github.base_ref }}" $CHARTS

  generate:
    name: Generate Metadata and Docs
    needs: [detect-changes, lint, test]
    if: ${{ needs.detect-changes.outputs.charts == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.RENOVATE_TOKEN || secrets.GITHUB_TOKEN }}
          fetch-depth: 0
          ref: ${{ github.head_ref }}

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.15"

      - name: Generate Changelog Annotations
        if: ${{ github.actor == 'renovate[bot]' || startsWith(github.head_ref, 'renovate/') }}
        env:
          CHECK_BRANCH: "origin/${{ github.event.repository.default_branch }}"
        run: |
          pip install -r ./.github/scripts/requirements.txt
          CHARTS_JSON='${{ needs.detect-changes.outputs.chart_names }}'
          CHARTS=$(echo $CHARTS_JSON | jq -r '.[]')
          for chart in $CHARTS; do
            ./.github/scripts/renovate-releasenotes.py --check-branch "$CHECK_BRANCH" "$chart"
          done

      - name: Generate Helm Docs
        uses: losisin/helm-docs-github-action@v2.0.1
        with:
          chart-search-root: charts

      - name: Create commit
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          file_pattern: 'charts/**'
          # No [skip ci]: the push uses RENOVATE_TOKEN, so CI runs again on the
          # new head and the required "CI successful" check reports on it.
          # The second run finds nothing to change and makes no commit.
          commit_message: "chore: Auto-update chart metadata and docs"
          commit_user_name: ${{ github.actor }}
          commit_user_email: ${{ github.actor }}@users.noreply.github.com

  # Single required status check for branch protection. Jobs skipped because
  # no chart changed count as passed; failed or cancelled ones do not.
  ci-successful:
    name: CI successful
    needs: [detect-changes, lint, test, version-check, generate]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check job results
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "$RESULTS"
          if echo "$RESULTS" | jq -e 'any(.[]; . == "failure" or . == "cancelled")' >/dev/null; then
            echo "::error::A required job failed or was cancelled"
            exit 1
          fi
