name: "Charts: Test"

on:
  workflow_call:
    inputs:
      checkoutCommit:
        required: true
        type: string
      chartsToTest:
        description: >
          A JSON encoded array of charts to lint
        type: string
        required: true
      overrideDeps:
        description: >
          A JSON encoded array of dependencies to override before testing
        type: string
        required: false
        default: '[]'

env:
  # renovate: datasource=github-releases depName=helm/helm
  HELM_VERSION: 4.3.2

jobs:
  install-chart:
    name: Install chart
    runs-on: ubuntu-26.04
    if: ${{ inputs.chartsToTest != '[]' && inputs.chartsToTest != '' }}
    strategy:
      matrix:
        chart: ${{ fromJSON(inputs.chartsToTest) }}
        include:
          - kubectl_version: "v1.33.3"
            k3s_version: "v1.33"
      fail-fast: false
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.checkoutCommit }}

      - name: Install Kubernetes tools
        uses: yokawasa/action-setup-kube-tools@v0.14.1
        with:
          setup-tools: |
            helm
            kubectl
          helm: "${{ env.HELM_VERSION }}"
          kubectl: "${{ matrix.kubectl_version }}"

      - uses: actions/setup-python@v7
        with:
          python-version: "3.15"

      - name: Set up chart-testing
        uses: helm/chart-testing-action@v2.9.0

      - name: Create k3d cluster
        uses: nolar/setup-k3d-k3s@v1
        with:
          version: ${{ matrix.k3s_version }}
          # Unauthenticated release lookups hit the shared-runner API rate limit (403)
          github-token: ${{ github.token }}

      - name: Remove node taints
        run: |
          kubectl taint --all=true nodes node.cloudprovider.kubernetes.io/uninitialized- || true

      - name: Override chart dependencies
        uses: ./.github/actions/override-chart-deps
        if: ${{ inputs.overrideDeps != '[]' }}
        with:
          chart: ${{ matrix.chart }}
          overrides: ${{ inputs.overrideDeps }}

      - name: Run chart-testing (install)
        run: ct install --config .github/ct/ct.yaml --charts "charts/${{ matrix.chart }}"

  # Summarize matrix https://github.community/t/status-check-for-a-matrix-jobs/127354/7
  install_success:
    needs:
      - install-chart
    if: |
      always()
    name: Install successful
    runs-on: ubuntu-26.04
    steps:
      - name: Check install matrix status
        if: ${{ (inputs.chartsToTest != '[]' && inputs.chartsToTest != '') && needs.install-chart.result != 'success' }}
        run: exit 1

  unittest-chart:
    name: Unit-test chart
    runs-on: ubuntu-26.04
    if: ${{ inputs.chartsToTest != '[]' && inputs.chartsToTest != '' }}
    strategy:
      matrix:
        chart: ${{ fromJSON(inputs.chartsToTest) }}
      fail-fast: false
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.checkoutCommit }}

      - name: Install Kubernetes tools
        uses: yokawasa/action-setup-kube-tools@v0.14.1
        with:
          setup-tools: |
            helm
          helm: "${{ env.HELM_VERSION }}"

      - name: Override chart dependencies
        uses: ./.github/actions/override-chart-deps
        if: ${{ inputs.overrideDeps != '[]' }}
        with:
          chart: ${{ matrix.chart }}
          overrides: ${{ inputs.overrideDeps }}

      - name: Run tests
        run: |
          if [ ! -d "charts/${{ matrix.chart }}/tests" ]; then
            echo "No unit tests for ${{ matrix.chart }}"
            exit 0
          fi
          # Helm 4 verifies plugins by default; the git source has no provenance
          helm plugin install https://github.com/helm-unittest/helm-unittest --version v1.2.1 --verify=false
          helm dep update "charts/${{ matrix.chart }}"
          helm unittest -f "tests/**/*_test.yaml" "charts/${{ matrix.chart }}"

  # Summarize matrix https://github.community/t/status-check-for-a-matrix-jobs/127354/7
  unittest_success:
    needs:
      - unittest-chart
    if: |
      always()
    name: Unittest successful
    runs-on: ubuntu-26.04
    steps:
      - name: Check unittest matrix status
        if: ${{ (inputs.chartsToTest != '[]' && inputs.chartsToTest != '') && needs.unittest-chart.result != 'success' }}
        run: exit 1
