suite: matterjs-server
templates:
  - templates/common.yaml
release:
  name: matter
tests:
  - it: runs on the host network as uid 1000 with Recreate
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - equal:
          path: spec.template.spec.hostNetwork
          value: true
      - equal:
          path: spec.template.spec.dnsPolicy
          value: ClusterFirstWithHostNet
      - equal:
          path: spec.template.spec.securityContext.runAsUser
          value: 1000
      - equal:
          path: spec.strategy.type
          value: Recreate
      - matchRegex:
          path: spec.template.spec.containers[?(@.name == "main")].image
          pattern: ^ghcr\.io/matter-js/matterjs-server:\d+\.\d+\.\d+$

  - it: keeps the fabric data on a PVC by default
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: data
            persistentVolumeClaim:
              claimName: matter
      - contains:
          path: spec.template.spec.containers[?(@.name == "main")].volumeMounts
          content:
            name: data
            mountPath: /data
      - contains:
          path: spec.template.spec.containers[?(@.name == "main")].env
          content:
            name: STORAGE_PATH
            value: /data

  - it: uses the image's health check for all probes
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - equal:
          path: spec.template.spec.containers[?(@.name == "main")].startupProbe.exec.command
          value: [/usr/local/bin/healthcheck.sh]
      - equal:
          path: spec.template.spec.containers[?(@.name == "main")].startupProbe.failureThreshold
          value: 180
      - equal:
          path: spec.template.spec.containers[?(@.name == "main")].livenessProbe.exec.command
          value: [/usr/local/bin/healthcheck.sh]

  - it: has no Bluetooth by default
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - notContains:
          path: spec.template.spec.containers[?(@.name == "main")].env
          content:
            name: NOBLE_BINDINGS
            value: dbus
      - lengthEqual:
          path: spec.template.spec.volumes
          count: 1

  - it: uses the host's BlueZ over D-Bus for Bluetooth
    set:
      bluetooth.adapter: 0
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - contains:
          path: spec.template.spec.containers[?(@.name == "main")].env
          content:
            name: BLUETOOTH_ADAPTER
            value: "0"
      - contains:
          path: spec.template.spec.containers[?(@.name == "main")].env
          content:
            name: NOBLE_BINDINGS
            value: dbus
      - contains:
          path: spec.template.spec.volumes
          content:
            name: dbus
            hostPath:
              path: /run/dbus
              type: Directory
      - contains:
          path: spec.template.spec.containers[?(@.name == "main")].volumeMounts
          content:
            name: dbus
            mountPath: /run/dbus
            readOnly: true
      - notExists:
          path: spec.template.spec.containers[?(@.name == "main")].securityContext.privileged

  - it: exposes the WebSocket API on 5580
    documentSelector:
      path: kind
      value: Service
    asserts:
      - contains:
          path: spec.ports
          content:
            name: http
            port: 5580
            protocol: TCP
            targetPort: 5580
