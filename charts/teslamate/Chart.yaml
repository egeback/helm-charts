---
apiVersion: v2
# renovate: datasource=github-releases depName=teslamate-org/teslamate
appVersion: 4.4.0
description: "A self-hosted data logger for your Tesla 🚘"
name: teslamate
version: 2.2.0
keywords:
  - teslamate
  - tesla
home: https://github.com/egeback/helm-charts/blob/main/charts/teslamate
icon: https://raw.githubusercontent.com/teslamate-org/teslamate/master/website/static/img/logo.svg
sources:
  - https://github.com/adriankumpf/teslamate
  - https://github.com/egeback/helm-charts/blob/main/charts/teslamate
dependencies:
  - name: common
    repository: https://bjw-s-labs.github.io/helm-charts
    version: 5.3.0
  - name: postgresql
    version: 18.2.5
    repository: https://charts.bitnami.com/bitnami
    condition: postgresql.enabled
maintainers:
  - name: egeback
    email: marky@egeback.se
annotations:
  artifacthub.io/changes: |2
      - kind: fixed
        description: Container env was nested under image and never applied; DATABASE_*, MQTT_*, ENCRYPTION_KEY and TZ now reach TeslaMate.
      - kind: fixed
        description: DATABASE_USER rendered as a literal string; sidecars referenced non-existent DATABASE_HOST/MQTT_HOST paths and postgresPassword.
      - kind: fixed
        description: Chart failed to render with default values or with postgresql enabled (subchart values are now excluded from template evaluation).
