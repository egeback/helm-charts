apiVersion: v2
# renovate: datasource=docker depName=ghcr.io/home-assistant/home-assistant versioning=docker
appVersion: 2026.11.0
description: Home Assistant helm package
name: home-assistant
version: 4.1.0
kubeVersion: ">=1.16.0-0"
keywords:
  - home-assistant
home: https://github.com/egeback/helm-charts/tree/main/charts/home-assistant
icon: https://brands.home-assistant.io/homeassistant/icon.png
sources:
  - https://github.com/home-assistant/home-assistant-docker
maintainers:
  - name: egeback
    email: marky@egeback.se
dependencies:
  - name: common
    repository: https://bjw-s-labs.github.io/helm-charts
