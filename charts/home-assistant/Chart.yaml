---
apiVersion: v2
# renovate: datasource=docker depName=ghcr.io/home-assistant/home-assistant versioning=docker
appVersion: 2026.11.0
description: Home Assistant helm package
name: home-assistant
version: 3.0.0
kubeVersion: ">=1.16.0-0"
keywords:
  - home-assistant
home: https://github.com/egeback/helm-charts/tree/main/charts/home-assistant
icon: https://brands.home-assistant.io/homeassistant/icon.png
sources:
  - https://github.com/home-assistant/home-assistant-docker
maintainers:
  - name: egeback
    email: marky@egeback.se
dependencies:
  - name: common
    repository: https://bjw-s-labs.github.io/helm-charts
    version: 5.3.0
  - name: influxdb
    version: 7.1.20
    repository: https://charts.bitnami.com/bitnami
    condition: influxdb.enabled
annotations:
  artifacthub.io/changes: |2
      - kind: removed
        description: Bitnami mariadb and postgresql subcharts (Bitnami's free images are only published as latest; the postgresql override pointed at a removed tag).
      - kind: added
        description: Bundled recorder database on the official mariadb (12.3 LTS) or postgres (18) image, with Secret/existingSecret and RECORDER_DB_URL on Home Assistant.
      - kind: fixed
        description: Chart failed to render with influxdb.enabled (subchart values are now excluded from template evaluation).
