annotations:
  artifacthub.io/changes: |2
      - kind: fixed
        description: Home Assistant crashed at start with default values (uid 1000 cannot write the image's /config); without persistence.config an emptyDir is mounted and NOTES warns.
      - kind: added
        description: HTTP startup, readiness and liveness probes on the web UI.
      - kind: removed
        description: Values that were never rendered (metrics.serviceMonitor/prometheusRule, top-level securityContext, defaultPodOptions.podSecurityContext); use serviceMonitor and per-container securityContext instead (see README).
      - kind: added
        description: README sections on persistence, Multus networking and Prometheus scraping.
