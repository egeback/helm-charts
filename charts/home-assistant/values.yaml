#
# IMPORTANT NOTE
#
# This chart inherits from the bjw-s common library chart. You can check the default values/options here:
# https://github.com/bjw-s-labs/helm-charts/blob/main/charts/library/common/values.yaml
#

controllers:
  main:
    containers:
      main:
        image:
          # -- image repository
          repository: ghcr.io/home-assistant/home-assistant
          # -- image tag
          # @default -- chart.appVersion
          tag: "{{ .Chart.AppVersion }}"
          # -- image pull policy
          pullPolicy: IfNotPresent

        # -- environment variables. See more environment variables in the [home-assistant documentation](https://home-assistant.org/docs).
        # @default -- See below
        env:
          # -- Set the container timezone
          TZ: UTC
        # -- Probes against the web UI; the startup probe allows for a slow first start
        # @default -- See values.yaml
        probes:
          startup:
            enabled: true
            type: HTTP
            path: /
            spec:
              periodSeconds: 5
              failureThreshold: 60
          readiness:
            enabled: true
            type: HTTP
            path: /
          liveness:
            enabled: true
            type: HTTP
            path: /
            spec:
              failureThreshold: 5
      code:
        enabled: false
        # -- environment variables. See more environment variables in the [home-assistant documentation](https://home-assistant.org/docs).
        # @default -- See below
        env:
          TZ: UTC
        image:
          # -- image repository
          repository: causticlab/hass-configurator-docker
          # -- image tag
          # renovate: datasource=docker depName=causticlab/hass-configurator-docker
          tag: 0.6.0

defaultPodOptions:
  automountServiceAccountToken: false
  dnsPolicy: ClusterFirstWithHostNet
  hostNetwork: true
  securityContext:
    fsGroup: 1000
    fsGroupChangePolicy: OnRootMismatch
    runAsGroup: 1000
    runAsUser: 1000

# -- Configures service settings for the chart.
# @default -- See values.yaml
service:
  main:
    controller: main
    ports:
      http:
        port: 8123
  code:
    enabled: false
    controller: main
    ports:
      code:
        port: 3218

ingress:
  # -- Enable and configure ingress settings for the chart under this key.
  # @default -- See values.yaml
  main:
    enabled: false

# -- Configure persistence settings for the chart under this key.
# @default -- See values.yaml
persistence:
  # -- Home Assistant's /config. While disabled the chart mounts an emptyDir
  #    instead (configuration is lost when the pod is recreated); enable it with
  #    a PVC or `existingClaim` for real use.
  # @default -- See values.yaml
  config:
    enabled: false
  # -- Configure a hostPathMount to mount a USB device in the container.
  # @default -- See values.yaml
  usb:
    enabled: false
    type: hostPath
    hostPath: /path/to/device

# -- Bundled MariaDB for the recorder, on the official `mariadb` image. When
#    enabled the chart sets `RECORDER_DB_URL` on Home Assistant; use it with
#    `recorder: {db_url: !env_var RECORDER_DB_URL}` in configuration.yaml.
# @default -- See values.yaml
mariadb:
  # -- Deploy a MariaDB StatefulSet (mutually exclusive with `postgresql.enabled`)
  enabled: false
  image:
    repository: docker.io/library/mariadb
    # -- Keep to a MariaDB LTS series Home Assistant supports (10.11, 11.4, 11.8, 12.3)
    # renovate: datasource=docker depName=mariadb
    tag: 13.0.2
  auth:
    database: homeassistant
    username: homeassistant
    # -- Password for `username`; required unless `existingSecret` is set. Must be URL-safe (it is embedded in RECORDER_DB_URL).
    password: ""
    # -- Root password; required unless `existingSecret` is set
    rootPassword: ""
    # -- Existing Secret with the keys `password` and `root-password`
    existingSecret: ""
  persistence:
    size: 8Gi
    accessMode: ReadWriteOnce
    # -- StorageClass for the data volume ("-" for none, empty for the cluster default)
    storageClass: ""
  resources: {}

# -- Bundled PostgreSQL for the recorder, on the official `postgres` image. When
#    enabled the chart sets `RECORDER_DB_URL` on Home Assistant; use it with
#    `recorder: {db_url: !env_var RECORDER_DB_URL}` in configuration.yaml.
# @default -- See values.yaml
postgresql:
  # -- Deploy a PostgreSQL StatefulSet (mutually exclusive with `mariadb.enabled`)
  enabled: false
  image:
    repository: docker.io/library/postgres
    # -- Home Assistant requires PostgreSQL 15 or newer from 2027.3; major upgrades need a dump/restore
    # renovate: datasource=docker depName=postgres
    tag: "18.6"
  auth:
    database: homeassistant
    username: homeassistant
    # -- Password for `username`; required unless `existingSecret` is set. Must be URL-safe (it is embedded in RECORDER_DB_URL).
    password: ""
    # -- Existing Secret with the key `password`
    existingSecret: ""
  persistence:
    size: 8Gi
    accessMode: ReadWriteOnce
    # -- StorageClass for the data volume ("-" for none, empty for the cluster default)
    storageClass: ""
  resources: {}
