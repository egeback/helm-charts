#
# IMPORTANT NOTE
#
# This chart inherits from the bjw-s common library chart. You can check the default values/options here:
# https://github.com/bjw-s-labs/helm-charts/blob/main/charts/library/common/values.yaml
#

controllers:
  main:
    # -- One instance owns the controller; Recreate avoids two pods opening the stick
    strategy: Recreate
    containers:
      main:
        image:
          # -- image repository
          repository: zwavejs/zwave-js-ui
          # -- image tag
          # @default -- chart.appVersion
          tag: "{{ .Chart.AppVersion }}"
          # -- image pull policy
          pullPolicy: IfNotPresent

        # -- Environment variables, see the [zwave-js-ui env vars](https://zwave-js.github.io/zwave-js-ui/#/guide/env-vars).
        #    SESSION_SECRET comes from the Secret, see `sessionSecret`.
        # @default -- See below
        env:
          # -- Set the container timezone
          TZ: UTC
          # -- Keep the device configuration database on the store volume so it survives image updates
          ZWAVEJS_EXTERNAL_CONFIG: /usr/src/app/store/.config-db

        # -- Probes against the web UI's /health
        # @default -- See values.yaml
        probes:
          startup:
            enabled: true
            type: HTTP
            path: /health
            spec:
              periodSeconds: 5
              failureThreshold: 60
          readiness:
            enabled: true
            type: HTTP
            path: /health
          liveness:
            enabled: true
            type: HTTP
            path: /health

# -- Z-Wave USB stick on the node, mounted at /dev/zwave (configure that path in
#    Settings → Z-Wave → Serial port). Needs a privileged container; pin the pod to
#    the node with the stick (`defaultPodOptions.nodeSelector`). Leave empty to use a
#    network-attached controller (`tcp://host:port`) instead.
# @default -- See below
device:
  # -- Path of the stick on the node; use /dev/serial/by-id/..., not /dev/ttyUSBx
  hostPath: ""

# -- Express session secret. Generated (and kept across upgrades) when empty.
sessionSecret: ""
# -- Existing Secret with the key `SESSION_SECRET`; used instead of `sessionSecret`
existingSecret: ""

# -- Configures service settings for the chart.
# @default -- See values.yaml
service:
  main:
    controller: main
    ports:
      http:
        port: 8091
      # -- Z-Wave JS WebSocket server for Home Assistant (enable it in Settings → Home Assistant)
      websocket:
        port: 3000

ingress:
  # -- Enable and configure ingress settings for the chart under this key.
  # @default -- See values.yaml
  main:
    enabled: false

# -- Configure persistence settings for the chart under this key.
# @default -- See values.yaml
persistence:
  # -- Settings, network security keys (S0/S2) and node cache. Losing it means
  #    re-including every device, so it is enabled by default.
  store:
    enabled: true
    type: persistentVolumeClaim
    accessMode: ReadWriteOnce
    size: 1Gi
    globalMounts:
      - path: /usr/src/app/store
